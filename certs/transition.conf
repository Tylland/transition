[ req ]
default_bits       = 2048
default_md         = sha256
default_keyfile    = mydomain.key
prompt             = no
encrypt_key        = no
distinguished_name = dn
req_extensions     = req_ext

[ dn ]
C  = SE                 # Country Name (2 letter code)
ST = Dalarna            # State or Province Name
L  = Tylla              # Locality Name
O  = Transition         # Organization Name
OU = Lab                # Organizational Unit Name
CN = localhost          # Common Name (FQDN)

[ req_ext ]
subjectAltName = @alt_names

[ alt_names ]
DNS.1 = www.example.com
DNS.2 = example.com
DNS.3 = sub.example.com
